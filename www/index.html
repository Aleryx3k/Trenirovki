<!doctype html>
<html lang="ru" data-theme="steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1117">
<title>Тренировки</title>
<script>
try {
  var __raw = localStorage.getItem("workout-log-v1");
  if (__raw) {
    var __data = JSON.parse(__raw);
    if (__data && __data.settings && __data.settings.theme === "chalk") {
      document.documentElement.setAttribute("data-theme", "chalk");
      var __m = document.querySelector('meta[name="theme-color"]');
      if (__m) __m.setAttribute("content", "#170b0e");
    }
  }
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<aside id="rest" class="rest hidden" role="timer" aria-label="Таймер отдыха">
  <span id="restText">Отдых 1:30</span>
  <button type="button" data-act="rest-add" aria-label="Добавить 15 секунд отдыха">+15с</button>
  <button type="button" data-act="rest-stop" aria-label="Пропустить отдых">Пропустить</button>
</aside>
<nav id="tabs" aria-label="Основная навигация">
  <button type="button" data-tab="train" class="on" aria-current="page"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Тренировка</button>
  <button type="button" data-tab="history"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
  <button type="button" data-tab="progress"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8"/></svg>Прогресс</button>
  <button type="button" data-tab="more"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="8" cy="17" r="1.6" fill="currentColor"/></svg>Ещё</button>
</nav>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script src="app.js"></script>
</body>
</html>
