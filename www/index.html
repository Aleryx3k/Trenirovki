<!doctype html>
<html lang="ru" data-theme="steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1117">
<title>Тренировки</title>
<script>try { var __t = JSON.parse(localStorage.getItem("workout-log-v1")).settings.theme; if (__t === "chalk") document.documentElement.setAttribute("data-theme", "chalk"); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"></main>
<div id="rest" class="rest hidden">
  <span id="restText">Отдых 1:30</span>
  <button data-act="rest-add">+15с</button>
  <button data-act="rest-stop">Пропустить</button>
</div>
<nav id="tabs">
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Тренировка</button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>История</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L19 8"/></svg>Прогресс</button>
  <button data-tab="more"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="8" cy="17" r="1.6" fill="currentColor"/></svg>Ещё</button>
</nav>
<script src="app.js"></script>
</body>
</html>
